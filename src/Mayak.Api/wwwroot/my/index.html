<style>
  :root {
    --navy: #0E1A2B; --navy2: #17263B; --amber: #F5A524; --amber-d: #D98B0B;

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }

  .btn { font: inherit; font-weight: 600; border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 10px;

  .btn.p { background: var(--amber); border-color: var(--amber-d); color: #1B1405; }

  :focus-visible { outline: 3px solid var(--amber-d); outline-offset: 2px; }

                      display: flex; flex-direction: column; align-items: center; gap: 6px; font-weight: 600; }

  .choices { display: grid; gap: 10px; margin: 12px 0; }

            border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px; min-height: 64px; cursor: pointer; text-decoration: none; }
  .choice:hover { border-color: var(--amber-d); }
  .choice b { display: block; font-size: 15.5px; }
  .choice .muted { display: block; font-size: 13px; }
  .choice.main { border-color: var(--amber); background: rgba(245,165,36,.08); }
  .qr-big { display: block; width: min(260px, 100%); height: auto; margin: 10px 0; background: #fff; border-radius: 10px; }
  ol.steps .sub { color: var(--muted); font-size: 13.5px; margin: 4px 0 0; }
  .tabs { display: flex; gap: 6px; margin: 4px 0 14px; flex-wrap: wrap; }
  .tabs button { font: inherit; font-size: 14px; border: 1px solid var(--line); background: var(--card); color: var(--muted); border-radius: 999px; padding: 8px 13px; min-height: 44px; cursor: pointer; }
  .tabs button.on { background: var(--navy); border-color: var(--navy); color: #fff; }
  @media (prefers-color-scheme: dark) { .tabs button.on { background: var(--amber); border-color: var(--amber); color: #1B1405; } }
  ol.steps { margin: 0; padding: 0; list-style: none; counter-reset: s; }
  ol.steps > li { counter-increment: s; position: relative; padding: 0 0 16px 40px; }
  ol.steps > li::before { content: counter(s); position: absolute; left: 0; top: -1px; width: 28px; height: 28px; border-radius: 50%; background: var(--soft); border: 1px solid var(--line);

  .qr { display: block; width: 220px; max-width: 100%; height: auto; image-rendering: pixelated; background: #fff; padding: 10px; border-radius: 12px; border: 1px solid var(--line); margin: 8px 0; }
  .note { background: rgba(245,165,36,.1); border: 1px solid rgba(245,165,36,.35); border-radius: 10px; padding: 10px 12px; font-size: 13.5px; }
  .err { color: var(--red); }
  input { font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%; min-height: 44px; }
  details summary { cursor: pointer; color: var(--muted); font-size: 14px; }
  #toast { position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--navy); color: #fff;
           padding: 10px 16px; border-radius: 10px; display: none; z-index: 9; font-size: 14px; box-shadow: 0 6px 20px rgba(0,0,0,.25); }
  .spin { width: 18px; height: 18px; border: 2px solid rgba(255,255,255,.4); border-top-color: #fff; border-radius: 50%; animation: r 1s linear infinite; }
  @keyframes r { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }
  [hidden] { display: none !important; }

<body class="portal-page">
<header><div class="in">
  <div class="brand"><img src="/newassets/mayak-v1/mayak-f7-small-on.svg" width="34" height="34" alt="" aria-hidden="true"><span class="wordmark">маяк</span></div>
  <button type="button" class="theme-toggle" data-theme-toggle aria-label="Тема: ночь. Переключить на день">День</button><div class="who" id="who"></div>
</div></header>
<main id="app"><div class="card hero muted">Загрузка…</div></main>

<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} },
  sget(k) { try { return sessionStorage.getItem(k); } catch { return null; } },
  sset(k, v) { try { v == null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, v); } catch {} },
};
// Кнопка «Получить доступ для iPhone или Mac» с главной ведёт сюда с ?access=apple.
// Намерение живёт в sessionStorage, чтобы пережить вход, регистрацию и возврат из Telegram.
let wantApple = (() => {
  const q = new URLSearchParams(location.search);
  if (q.get("access") === "apple") {
    store.sset("mayak.intent", "apple");
    q.delete("access");
    const rest = q.toString();
    history.replaceState(null, "", location.pathname + (rest ? "?" + rest : "") + location.hash);
    return true;
  }
  return store.sget("mayak.intent") === "apple";
})();
let token = store.get("mayak.token");
let me = null, state = null, view = { name: "home" };

function toast(t) { const el = $("#toast"); el.textContent = t; el.style.display = "block"; clearTimeout(toast.t); toast.t = setTimeout(() => el.style.display = "none", 2600); }
async function copy(text) {
  try { await navigator.clipboard.writeText(text); toast("Скопировано"); }
  catch { const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); toast("Скопировано"); }
}
async function api(path, opt = {}) {
  const headers = { "Content-Type": "application/json" };
  if (token) headers.Authorization = "Bearer " + token;
  const res = await fetch(path, { method: opt.method || "GET", headers, body: opt.body ? JSON.stringify(opt.body) : undefined, cache: "no-store" });
  const data = res.status === 204 ? null : await res.json().catch(() => null);
  if (res.status === 401 && token) { token = null; store.set("mayak.token", null); me = null; }
  if (!res.ok) {
    const error = new Error(data?.error || data?.status || `Ошибка ${res.status}`);
    error.status = res.status;
    error.code = data?.status;
    throw error;
  }
  return data;
}
function ago(iso) {
  if (!iso) return "ещё не подключалось";
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  if (m < 3) return "в сети";
  if (m < 60) return `был в сети ${m} мин назад`;
  const h = Math.round(m / 60);
  if (h < 24) return `был в сети ${h} ч назад`;
  return "был в сети " + new Date(iso).toLocaleDateString("ru-RU");
}
function day(iso) { return iso ? new Date(iso).toLocaleDateString("ru-RU", { day: "numeric", month: "long", year: "numeric" }) : ""; }

// ───── Платформы и приложения ─────
const ICON = {
  IPhone: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M10.5 18.5h3"/></svg>',
  Android: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4.5 16a7.5 7.5 0 0 1 15 0z"/><path d="M7 8.5L5.3 6M17 8.5l1.7-2.5"/><circle cx="9" cy="12.6" r=".6" fill="currentColor"/><circle cx="15" cy="12.6" r=".6" fill="currentColor"/></svg>',
  Windows: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M8 20h8M12 16v4"/></svg>',
  Mac: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4.5" width="16" height="11" rx="1.5"/><path d="M2 19h20"/></svg>',
  Linux: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6l5 5-5 5M12 18h8"/></svg>',
  Other: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"/></svg>',
};
const PLATFORMS = [
  { kind: "IPhone", title: "iPhone / iPad" },
  { kind: "Android", title: "Android" },
  { kind: "Windows", title: "Windows" },
  { kind: "Mac", title: "Mac" },
  { kind: "Linux", title: "Linux" },
];
const LINKS = {
  awgApple: "https://apps.apple.com/app/amneziawg/id6478942365",
  defaultVpn: "https://apps.apple.com/app/defaultvpn/id6744725017",
  amneziaPlay: "https://play.google.com/store/apps/details?id=org.amnezia.vpn",
  awgPlay: "https://play.google.com/store/apps/details?id=org.amnezia.awg",
  amneziaReleases: "https://github.com/amnezia-vpn/amnezia-client/releases/latest",
  amneziaSite: "https://amnezia.org/ru/downloads",
  awgWindows: "https://github.com/amnezia-vpn/amneziawg-windows-client/releases/latest",
};
function detectKind() {
  const ua = navigator.userAgent;
  if (/iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1)) return "IPhone";
  if (/Android/.test(ua)) return "Android";
  if (/Windows/.test(ua)) return "Windows";
  if (/Macintosh/.test(ua)) return "Mac";
  if (/Linux/.test(ua)) return "Linux";
  return "IPhone";
}
const here = detectKind();
const isPhone = here === "IPhone" || here === "Android";

// Подробные шаги для iPhone и Mac: своего приложения Маяка там нет, подключение идёт через AmneziaWG из App Store.
const storeLink = `<a href="${LINKS.awgApple}" target="_blank" rel="noopener">AmneziaWG в App Store</a>`;
function iphoneSteps(f, onThis) {
  const fileBtn = `<button class="btn p" data-act="file">Скачать файл доступа</button>`;
  const qr = `<img class="qr-big" src="${f.qrConf}" alt="QR-код доступа для AmneziaWG">`;
  const add = onThis
    ? `<li><b>Скачайте файл доступа.</b><div style="margin-top:8px">${fileBtn}</div>
         <p class="sub">Safari спросит, загрузить ли файл: нажмите «Загрузить». Файл ${esc(f.confName)} попадёт в «Файлы» → «Загрузки».</p></li>
       <li><b>Добавьте файл в AmneziaWG.</b> Откройте AmneziaWG, нажмите «+» и выберите создание туннеля из файла. Найдите в «Загрузках» файл ${esc(f.confName)} и нажмите на него.
         <p class="sub">Если iPhone сам предложит открыть файл в AmneziaWG, можно согласиться: результат тот же.</p></li>`
    : `<li><b>Отсканируйте QR-код с iPhone.</b> На iPhone откройте AmneziaWG, нажмите «+», выберите создание туннеля из QR-кода и разрешите доступ к камере. Наведите камеру на этот код:${qr}
         <p class="sub">Неудобно сканировать? Откройте этот кабинет на самом iPhone, войдите той же почтой и паролем и скачайте файл там.</p></li>`;
  return `<ol class="steps">
      <li><b>Установите приложение.</b> На iPhone откройте ${storeLink} и установите его. Нужен iOS 15 или новее.</li>
      ${add}
      <li><b>Разрешите VPN.</b> Если AmneziaWG попросит название туннеля, напишите «Маяк». Затем iPhone спросит, разрешить ли добавление конфигураций VPN: нажмите «Разрешить» и подтвердите код-паролем или Face ID.</li>
      <li><b>Включите Маяк.</b> В AmneziaWG включите переключатель у нового туннеля. Вверху экрана появится значок VPN.</li>
      <li><b>Проверьте.</b> Откройте в Safari любой сайт. Выключить VPN можно тем же переключателем или в «Настройки» → «VPN».</li></ol>`;
}
function macSteps(f, onThis) {
  const fileBtn = `<button class="btn p" data-act="file">Скачать файл доступа</button>`;
  return `<ol class="steps">
      <li><b>Установите приложение.</b> На Mac откройте ${storeLink} и установите его. Нужна macOS 12 или новее.</li>
      <li><b>Скачайте файл доступа${onThis ? "" : " на Mac"}.</b>${onThis
          ? `<div style="margin-top:8px">${fileBtn}</div><p class="sub">Файл ${esc(f.confName)} сохранится в папку «Загрузки».</p>`
          : ` Откройте этот кабинет на самом Mac, войдите той же почтой и паролем, нажмите «Инструкция» у этого устройства и скачайте файл там.<div style="margin-top:8px">${fileBtn}</div><p class="sub">Или скачайте файл здесь и перенесите его на Mac, например через AirDrop.</p>`}</li>
      <li><b>Добавьте файл в AmneziaWG.</b> Откройте AmneziaWG. Если окна с туннелями не видно, нажмите значок AmneziaWG в строке меню вверху экрана и откройте управление туннелями. Выберите «Импорт туннелей из файла» и укажите ${esc(f.confName)} из «Загрузок».</li>
      <li><b>Разрешите VPN.</b> macOS спросит, разрешить ли AmneziaWG добавлять конфигурации VPN: нажмите «Разрешить» и при необходимости введите пароль Mac.</li>
      <li><b>Включите Маяк.</b> Выберите туннель в списке и нажмите «Подключить». Отключить его можно там же или через значок в строке меню.</li></ol>`;
}

// Варианты подключения для платформы: первый — рекомендуемый.
function options(kind, f) {
  const fileBtn = `<button class="btn s" data-act="file">Скачать файл ${esc(f.confName)}</button>`;
  const keyBlock = `<div class="key">${esc(f.vpnKey)}</div><button class="btn s p" data-act="key">Скопировать ключ</button>`;
  const qrBlock = `<img class="qr" src="${f.qrConf}" alt="QR-код настроек">`;
  const awgSteps = (store, scanHint) => `<ol class="steps">
      <li>Установите <b>AmneziaWG</b>: <a href="${store}" target="_blank" rel="noopener">${store.includes("apple") ? "App Store" : store.includes("google") ? "Google Play" : "скачать"}</a>.</li>
      <li>${scanHint}</li>
      <li>Разрешите добавить VPN и включите переключатель.</li></ol>`;
  const amneziaSteps = (where) => `<ol class="steps">
      <li>Установите <b>AmneziaVPN</b>: ${where}.</li>
      <li>Скопируйте ключ:${keyBlock}</li>
      <li>В AmneziaVPN нажмите «Добавить» (+) → «Вставить» и подключитесь.</li></ol>`;
  const onThis = kind === here;
  switch (kind) {
    case "IPhone": return [
      { id: "awg", title: "AmneziaWG", html: iphoneSteps(f, onThis) },
      { id: "dvpn", title: "DefaultVPN", html: `<ol class="steps">
          <li>Если AmneziaWG нет в App Store — установите <b>DefaultVPN</b>: <a href="${LINKS.defaultVpn}" target="_blank" rel="noopener">App Store</a> (нужен iOS 16+).</li>
          <li>Скопируйте ключ:${keyBlock}</li>
          <li>В DefaultVPN добавьте подключение по ключу и включите его.</li></ol>` },

const INVITE_TOKEN = /^[A-Za-z0-9_-]{4,128}$/;
function parseInvite(value) {
  const raw = String(value || "").trim();
  if (INVITE_TOKEN.test(raw)) return raw;
  try {
    const url = new URL(raw);
    const trusted = (url.protocol === "https:" && url.hostname === "mayaklight.ru") || url.origin === location.origin;
    if (!trusted || !/^\/my\/?$/.test(url.pathname)) return null;
    const code = url.searchParams.get("invite") || "";
    return INVITE_TOKEN.test(code) ? code : null;
  } catch { return null; }
}
let invite = (() => {
  const raw = new URLSearchParams(location.search).get("invite");
  if (raw !== null) {
    const parsed = parseInvite(raw);
    store.sset("mayak.invite", parsed);
    history.replaceState(null, "", location.pathname);
    return parsed;
  }
  const cached = parseInvite(store.sget("mayak.invite"));
  if (!cached) store.sset("mayak.invite", null);
  return cached;
})();
let authMode = invite ? "register" : "login";
let login = null, polling = false;
// Начатый вход хранится между перезагрузками: телефон часто выгружает вкладку, пока человек в Telegram.
const pending = {
  get() { try { const p = JSON.parse(store.get("mayak.login") || "null"); return p && p.until > Date.now() ? p : null; } catch { return null; } },
  set(p) { store.set("mayak.login", p ? JSON.stringify(p) : null); },
};
// Кнопка «Вернуться на сайт» из бота приносит код входа в адресе.
const returned = (() => {
  const q = new URLSearchParams(location.search).get("login");
  if (q) history.replaceState(null, "", location.pathname);
  return q;
})();

async function finishLogin(requestId, { quiet } = {}) {
  const res = await fetch(`/api/auth/telegram/${encodeURIComponent(requestId)}?client=site`);
  if (res.status === 202) return "pending";   // 202 — тоже «ok» для fetch, поэтому проверяем первым
  if (res.status === 200) {
    const d = await res.json();
    token = d.token; store.set("mayak.token", token); store.sset("mayak.invite", null); pending.set(null);
    await boot();
    return "ok";
  }
  if (!quiet) pending.set(null);
  return "expired";
}

async function prepareLogin() {
  try {
    login = await api("/api/auth/telegram", { method: "POST", body: { invite, return: "/my/" } });
    login.until = Date.now() + login.expiresInSeconds * 1000 - 15000;
    const a = $("#tg");
    if (a) { a.href = login.botUrl; a.removeAttribute("aria-disabled"); }
  } catch (e) {
    if (/Приглашение/.test(e.message)) store.sset("mayak.invite", null);
    const h = $("#loginHint"); if (h) h.innerHTML = `<span class="err">${esc(e.message)}</span>`;
  }
}
async function pollLogin(id = login?.requestId, until = login ? login.until + 15000 : 0) {
  if (!id || pollLogin.active === id) return;
  pollLogin.active = id;
  pending.set({ id, until });
  const hint = $("#loginHint");
  if (hint) hint.innerHTML = "В боте нажмите «Запустить», затем — кнопку <b>«Вернуться на сайт»</b> в его ответе.";
  let result = "timeout";
  try {
    while (Date.now() < until && pollLogin.active === id) {
      result = await finishLogin(id, { quiet: true });
      if (result !== "pending") break;
      await new Promise(ok => setTimeout(ok, 2000));
    }
  } catch {}
  if (pollLogin.active !== id) return;      // уже ждём другой, более новый вход
  pollLogin.active = null;
  if (result === "ok" || me) return;
  if (pending.get()?.id === id) pending.set(null);
  if ($("#loginHint")) $("#loginHint").textContent = "Время на вход вышло — нажмите кнопку ещё раз.";
  await prepareLogin();
}
// Вернулись из Telegram на ту же вкладку — сразу проверяем, подтверждён ли вход.
function resume() {
  if (me || document.hidden) return;
  const p = pending.get();
  if (p) pollLogin(p.id, p.until);
}
document.addEventListener("visibilitychange", resume);
window.addEventListener("pageshow", resume);
window.addEventListener("focus", resume);

async function boot() {
  if (!token && returned && !boot.triedReturn) {
    boot.triedReturn = true;
    $("#app").innerHTML = `<div class="card hero muted">Завершаем вход…</div>`;
    const r = await finishLogin(returned).catch(() => "expired");
    if (r === "ok") return;
    if (r === "pending") { pending.set({ id: returned, until: Date.now() + 9 * 60000 }); }
  }
  if (!token) return render();
  try { state = await api("/api/me"); me = state.account; } catch { me = null; }
  render();
}

function render() {
  if (!me) return renderLogin();
  $("#who").innerHTML = `<span>${esc(me.name)}</span><a href="#" id="out">выйти</a>`;
  $("#out").onclick = e => { e.preventDefault(); logout(); };
  if (!me.enabled) return renderWaiting();

    bindCredentialForm();

  }
  if (wantApple) {
    // Пришли за доступом для iPhone или Mac: сразу на экран выдачи, один раз.
    wantApple = false; store.sset("mayak.intent", null);
    if (view.name === "home") view = { name: "add", kind: appleKind() };

    </div>
    <div class="card">
      <div class="row" style="margin-bottom:4px"><h2 class="grow" style="margin:0">Устройства</h2><span class="muted">${devs.length} из ${me.maxDevices}</span></div>
      ${devs.length ? "" : `<p class="muted" style="margin:10px 0 4px">Пока ни одного. Устройство появится здесь, когда вы войдёте в приложении или получите доступ для iPhone или Mac.</p>`}
      <div id="devs"></div>
      ${canAdd ? "" : `<p class="muted" style="margin-top:12px">Достигнут лимит устройств. Чтобы добавить новое, удалите ненужное.</p>`}
    </div>
    <div class="card"><p class="muted" style="margin:0">Доступ ${me.paidUntil ? `до ${esc(day(me.paidUntil))}` : "без срока"}${me.downMbps ? ` · скорость до ${me.downMbps} Мбит/с` : ""}. Вопросы — администратору в Telegram.</p></div>`;
  bindCredentialForm();
  const box = $("#devs");
  for (const d of devs) {
    const el = document.createElement("div");
    el.className = "dev";
    el.innerHTML = `<div class="ico">${ICON[d.kind] || ICON.Other}</div>
      <div class="grow"><b>${esc(d.name)}</b><div class="muted">${d.enabled ? esc(ago(d.lastHandshake)) : "приостановлено администратором"}</div></div>
      ${!d.enabled ? `<span class="muted">доступ устройства выключен</span>` : d.canExport ? `<button class="btn s" data-id="${d.id}">${d.kind === "IPhone" || d.kind === "Mac" ? "Инструкция" : "Ключ"}</button>` : `<span class="muted">в приложении Маяк</span>`}`;
    const b = el.querySelector("button");
    if (b) b.onclick = () => openSetup(d);
    box.appendChild(el);
  }
  $("#apple").onclick = () => { view = { name: "add", kind: appleKind() }; render(); };
  if ($("#getKey")) $("#getKey").onclick = async () => {
    try {
      const r = await api("/api/app-key");
      $("#appKey").innerHTML = `<ol class="steps"><li>Установите приложение Маяк по ссылке для Windows или Android выше.</li>
        <li>Скопируйте ключ:<div class="key">${esc(r.key)}</div><button class="btn s p" id="cpApp">Скопировать</button></li>
        <li>В приложении нажмите «Добавить» → «Вставить ключ» — и «Подключиться».</li></ol>`;
      $("#cpApp").onclick = () => copy(r.key);
    } catch (e) { toast(e.message); }
  };
}

// Выдача доступа для iPhone или Mac: устройство создаётся сразу, затем открывается подробная инструкция.
function renderAdd() {
  if (!APPLE.some(p => p.kind === view.kind)) view.kind = appleKind();
  const canAdd = state.devices.length < me.maxDevices;
  const server = serverName();
  const blocked = !state.ready
    ? `<p class="note">Серверный кластер не настроен. Обратитесь к администратору, чтобы получить доступ.</p>`
    : !canAdd ? `<p class="note">Достигнут лимит: ${state.devices.length} из ${me.maxDevices} устройств. Вернитесь назад и удалите ненужное устройство, затем получите доступ.</p>` : "";
  $("#app").innerHTML = `<div class="card">
      <button class="link" id="back">← Назад</button>
      <h1 style="margin-top:10px">Доступ для iPhone или Mac</h1>
      <p class="muted">Для iPhone и Mac нет отдельного приложения Маяк. Маяк выдаст личный файл доступа, а подключаться вы будете через приложение AmneziaWG из App Store.
        Доступ ведёт на основной сервер Маяка${server ? ` (${esc(server)})` : ""}.</p>
      <h3>Какое устройство подключаем?</h3>
      <div class="platforms" id="pl" style="margin:10px 0 14px"></div>
      <label class="muted" for="nm">Название (чтобы отличать устройства)</label>
      <input id="nm" maxlength="40" placeholder="Например: iPhone мамы" style="margin:6px 0 14px">
      ${blocked}
      <button class="btn p w" id="go"${blocked ? " disabled" : ""}>Получить доступ</button>
      <p class="err" id="err" style="margin-top:10px"></p>
      <p class="muted" style="margin-top:6px">После нажатия откроется пошаговая инструкция: установить AmneziaWG, добавить файл доступа, разрешить VPN, включить и проверить.</p>
    </div>`;
  const pl = $("#pl");
  for (const p of APPLE) {
    const b = document.createElement("button");
    b.type = "button";
    b.innerHTML = `${ICON[p.kind]}<span>${p.title}</span><span class="muted" style="font-weight:400;font-size:12.5px">${p.need}</span>`;
    b.classList.toggle("on", view.kind === p.kind);
    b.setAttribute("aria-pressed", String(view.kind === p.kind));
    b.onclick = () => {
      view.kind = p.kind;
      pl.querySelectorAll("button").forEach(x => { x.classList.remove("on"); x.setAttribute("aria-pressed", "false"); });
      b.classList.add("on"); b.setAttribute("aria-pressed", "true");
    };
    pl.appendChild(b);
  }
  $("#back").onclick = () => { view = { name: "home" }; render(); };
  $("#go").onclick = async () => {
    const btn = $("#go"); btn.disabled = true; btn.setAttribute("aria-busy", "true"); btn.textContent = "Готовим доступ…";
    try {
      const r = await api("/api/devices", { method: "POST", body: { name: $("#nm").value, kind: view.kind } });
      state.devices.push(r.device);
      view = { name: "setup", device: r.device, files: r.files, fresh: true };
      render();
    } catch (e) {
      $("#err").textContent = e.code === "no_ready_exit" ? "Сейчас системе не удалось назначить настроенный сервер для нового устройства. Попробуйте позже или обратитесь к администратору Маяка."
        : e.code === "provisioning" ? "Настройка сервера ещё выполняется. Попробуйте позже или обратитесь к администратору Маяка."
        : e.message;
      btn.disabled = false; btn.removeAttribute("aria-busy"); btn.textContent = "Получить доступ";
    }
  };
}

async function openSetup(d) {
  try {
    const files = await api(`/api/devices/${d.id}/files`);
    view = { name: "setup", device: d, files };
    render();
  } catch (e) { toast(e.message); }
}

function renderSetup() {
  const { device: d, files: f } = view;
  const kind = PLATFORMS.some(p => p.kind === d.kind) ? d.kind : here;
  const apple = kind === "IPhone" || kind === "Mac";
  const opts = options(kind, f);
  const sel = view.opt || opts[0].id;
  const cur = opts.find(o => o.id === sel) || opts[0];
  $("#app").innerHTML = `<div class="card">
      <button class="link" id="back">← К устройствам</button>
      <div class="row" style="margin-top:12px"><div class="ico">${ICON[d.kind] || ICON.Other}</div><div class="grow"><h1 style="margin:0">${esc(d.name)}</h1>
        <div class="muted">${view.fresh ? (apple ? "Доступ готов. Осталось пройти шаги ниже." : "Устройство добавлено. Осталось настроить приложение.") : apple ? "Инструкция и файл доступа этого устройства" : "Ключ этого устройства"}</div></div></div>
      ${apple ? `<p class="muted" style="margin-top:14px">Доступ ведёт на основной сервер Маяка${serverName() ? ` (${esc(serverName())})` : ""}. Файл и QR-код можно открыть снова кнопкой «Инструкция» у этого устройства в кабинете.</p>` : ""}
      ${kind !== here && kind === "Android" ? `<p class="note" style="margin-top:14px">Вы настраиваете телефон с другого устройства: отсканируйте QR-код ниже приложением AmneziaWG на телефоне. Или откройте этот сайт на самом телефоне — там всё делается в пару нажатий.</p>` : ""}
      <div class="tabs" style="margin-top:16px">${opts.map((o, i) => `<button data-o="${o.id}" class="${o.id === cur.id ? "on" : ""}">${esc(o.title)}${i === 0 ? " · рекомендуем" : ""}</button>`).join("")}</div>
      <div id="how">${cur.html}</div>
      ${apple ? `<p class="note" style="margin-top:16px">На ${d.kind === "Mac" ? "Mac" : "iPhone"} через Маяк идёт весь трафик, в том числе российские сайты: разделения «Россия напрямую», как в приложении для Windows и Android, здесь нет. Если российский сервис не открывается, выключите туннель на время.</p>` : ""}
      <p class="muted" style="margin-top:16px">${apple ? "Файл доступа личный: не пересылайте его другим. Для другого устройства получите отдельный доступ." : "Ключ личный: не пересылайте его другим — для другого устройства добавьте новое."}</p>
    </div>
    ${f.vless ? `<div class="card"><details><summary>Не подключается? Запасной способ</summary>
      <p style="margin-top:10px">Ссылка для приложений с протоколом VLESS: <b>v2RayTun</b>, <b>Happ</b>, <b>Streisand</b> (iPhone), <b>v2rayNG</b> (Android), <b>Hiddify</b> (любые системы).
      Скопируйте и добавьте в приложении «из буфера обмена» или отсканируйте QR-код.</p>
      <div class="key">${esc(f.vless)}</div><button class="btn s p" id="cpv">Скопировать ссылку</button>
      <img class="qr" src="${f.qrVless}" alt="QR-код ссылки"></details></div>` : ""}
    <div class="card row"><button class="btn s d" id="del">Удалить устройство</button>
      <span class="muted grow">Ключ на нём перестанет работать.</span></div>`;
  $("#back").onclick = () => { view = { name: "home" }; boot(); };
  renderDeviceSubscription(d);
  document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => { view.opt = b.dataset.o; render(); });
  document.querySelectorAll('[data-act="key"]').forEach(b => b.onclick = () => copy(f.vpnKey));
  document.querySelectorAll('[data-act="file"]').forEach(b => b.onclick = () => download(f.confName, f.conf));
  if ($("#cpv")) $("#cpv").onclick = () => copy(f.vless);
  $("#del").onclick = async () => {
    if (!confirm(`Удалить «${d.name}»? Ключ на этом устройстве перестанет работать.`)) return;
    try { await api(`/api/devices/${d.id}`, { method: "DELETE" }); view = { name: "home" }; toast("Устройство удалено"); boot(); }
    catch (e) { toast(e.message); }
  };
}

function renderDeviceSubscription(device) {
  const card = document.createElement("section");
  card.className = "card";
  card.setAttribute("aria-labelledby", "subscriptionTitle");
  const title = document.createElement("h2");
  title.id = "subscriptionTitle";
  title.textContent = "Подписка для v2RayTun";
  card.append(title);
  const note = document.createElement("p");
  note.className = "muted";
  note.textContent = "Новая ссылка заменит предыдущую. Если вы уже добавляли эту подписку, обновите её в приложении. Скачанные конфиги продолжат работать; чтобы полностью отключить устройство, выключите или удалите его.";
  card.append(note);

  const actions = document.createElement("div");
  actions.className = "row";
  const issue = document.createElement("button");
  issue.className = "btn p";
  issue.type = "button";
  issue.textContent = "Создать / перевыпустить ссылку";
  const revoke = document.createElement("button");
  revoke.className = "btn d";
  revoke.type = "button";
  revoke.textContent = "Отозвать ссылку";
  const result = document.createElement("div");
  result.className = "subscription-result";
  result.setAttribute("aria-live", "polite");
  result.setAttribute("role", "status");
  actions.append(issue, revoke);
  card.append(actions, result);
  $("#app").append(card);

  const canUse = !!me?.enabled && !!me?.active && !!device.enabled;
  issue.disabled = !canUse;
  revoke.disabled = !canUse;
  if (!canUse) {
    const blocked = document.createElement("p");
    blocked.className = "note";
    blocked.textContent = !device.enabled ? "Устройство выключено администратором." : "Для подписки нужен включённый аккаунт с действующим доступом.";
    card.insertBefore(blocked, actions);
  }
  if (view.subscriptionError) showSubscriptionFailure(view.subscriptionError, result);
  else if (view.subscription?.deviceId === device.id) showSubscription(view.subscription, result);

  issue.onclick = async () => {
    if (!canUse || !confirm("Выпустить новую ссылку? Она заменит прежнюю ссылку подписки. Уже скачанные конфиги продолжат работать.")) return;
    issue.disabled = true;
    result.textContent = "Создаём ссылку…";
    try {
      const created = await api(`/api/devices/${encodeURIComponent(device.id)}/subscription`, { method: "POST" });
      view.subscription = created;
      view.subscriptionError = null;
      showSubscription(created, result);
    } catch (e) {
      view.subscriptionError = { operation: "rotation", message: e.message || "Ошибка сервера" };
      showSubscriptionFailure(view.subscriptionError, result);
    } finally { issue.disabled = !canUse; }
  };
  revoke.onclick = async () => {
    if (!canUse || !confirm("Отозвать ссылку подписки? Она перестанет обновлять конфигурацию. Уже скачанные конфиги продолжат работать, пока устройство включено. Для полного отключения выключите или удалите устройство.")) return;
    revoke.disabled = true;
    result.textContent = "Отзываем ссылку…";
    try {
      await api(`/api/devices/${encodeURIComponent(device.id)}/subscription`, { method: "DELETE" });
      view.subscription = null;
      view.subscriptionError = null;
      result.textContent = "Ссылка отозвана. Уже скачанные конфиги продолжают работать, пока устройство включено.";
    } catch (e) {
      view.subscriptionError = { operation: "revoke", message: e.message || "Ошибка сервера" };
      showSubscriptionFailure(view.subscriptionError, result);
    } finally { revoke.disabled = !canUse; }
  };
}

function showSubscription(subscription, target) {
  target.replaceChildren();
  const label = document.createElement("p"); label.className = "muted"; label.textContent = "Ссылка для обновления подписки (хранится только в этой вкладке):";
  const value = document.createElement("div"); value.className = "key"; value.textContent = subscription.url;
  const row = document.createElement("div"); row.className = "row";
  const copyButton = document.createElement("button"); copyButton.type = "button"; copyButton.className = "btn s"; copyButton.textContent = "Скопировать ссылку"; copyButton.onclick = () => copy(subscription.url);
  const importLink = document.createElement("a"); importLink.className = "btn s p"; importLink.textContent = "Открыть в v2RayTun"; importLink.href = subscription.importUrl; importLink.rel = "noopener";
  row.append(copyButton, importLink);
  target.append(label, value, row);
}

function showSubscriptionFailure(failure, target) {
  target.replaceChildren();
  const error = document.createElement("p"); error.className = "err"; error.setAttribute("role", "alert");
  error.textContent = failure.message || "Не удалось подтвердить результат запроса.";
  const warning = document.createElement("p"); warning.className = "note";
  warning.textContent = failure.operation === "rotation"
    ? "Результат перевыпуска не подтверждён: последняя полученная ссылка могла уже смениться и может не работать. Не считайте её активной без проверки."
    : "Результат отзыва не подтверждён: последняя полученная ссылка могла уже перестать обновляться. Её состояние неизвестно."
  target.append(error, warning);
  if (!view.subscription?.url) return;
  const label = document.createElement("p"); label.className = "muted"; label.textContent = "Последняя полученная ссылка (её актуальность не подтверждена):";
  const value = document.createElement("div"); value.className = "key"; value.textContent = view.subscription.url;
  const copyButton = document.createElement("button"); copyButton.type = "button"; copyButton.className = "btn s";
  copyButton.textContent = "Скопировать последнюю ссылку"; copyButton.onclick = () => copy(view.subscription.url);
  target.append(label, value, copyButton);
}

function download(name, text) {
  const blob = new Blob([text], { type: "application/octet-stream" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

boot();
</script>
</body>
</html>
