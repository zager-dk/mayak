<!doctype html>
<html lang="ru" data-theme="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Маяк · управление</title>
<style>
  :root {
    --navy: #0E1A2B; --navy2: #1A2A40; --amber: #F5A524; --amber-d: #D98B0B;
    --page: #F4F6F9; --card: #FFFFFF; --line: #E2E6EC; --text: #1B2533; --muted: #6B7788;
    --green: #1F9D55; --red: #D64545; --orange: #E07B00;
  }
  @media (prefers-color-scheme: dark) {
    :root { --page: #0B1320; --card: #131E2E; --line: #24324A; --text: #E6EBF2; --muted: #8C9AAE; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 "Segoe UI", system-ui, -apple-system, sans-serif; background: var(--page); color: var(--text); }
  header { background: var(--navy); color: #fff; padding: 12px 16px; display: flex; align-items: center; gap: 12px; }
  header b { font-size: 16px; }
  header .who { margin-left: auto; color: #C9D3E0; font-size: 13px; }
  nav { display: flex; gap: 4px; padding: 0 12px; background: var(--card); border-bottom: 1px solid var(--line); overflow-x: auto; }
  nav button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 12px 12px; font: inherit; color: var(--muted); cursor: pointer; white-space: nowrap; }
  nav button.on { color: var(--text); border-color: var(--amber); font-weight: 600; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 16px; margin-bottom: 12px; }
  h2 { font-size: 16px; margin: 0 0 10px; }
  .row > h2 { flex: 1 1 180px; margin: 0; }
  .muted { color: var(--muted); font-size: 12.5px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .grow { flex: 1; min-width: 0; }
  button.b, a.b { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 6px; padding: 7px 12px; cursor: pointer; text-decoration: none; display: inline-block; }
  button.b:hover { border-color: #B8C2D0; }
  button.p { background: var(--amber); border-color: var(--amber-d); color: #1B1405; font-weight: 600; }
  button.d { color: var(--red); }
  button:disabled { opacity: .45; cursor: default; }
  input, select, textarea { font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
  .list > div { padding: 10px 4px; border-top: 1px solid var(--line); cursor: pointer; display: flex; gap: 10px; align-items: center; }
  .list > div:first-child { border-top: 0; }
  .list > div:hover { background: rgba(245,165,36,.07); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #B8C2D0; flex: none; }
  .dot.on { background: var(--green); } .dot.off { background: var(--red); } .dot.warn { background: var(--orange); }
  .chip { font-size: 11.5px; padding: 1px 7px; border-radius: 10px; background: rgba(107,119,136,.15); color: var(--muted); }
  .chip.wait { background: rgba(224,123,0,.15); color: var(--orange); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  td, th { text-align: left; padding: 7px 6px; border-top: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; border-top: 0; }
  code, pre { font-family: "Cascadia Mono", Consolas, monospace; font-size: 12px; }
  pre { white-space: pre-wrap; word-break: break-all; background: var(--page); border: 1px solid var(--line); border-radius: 6px; padding: 10px; }
  .stats { display: flex; gap: 24px; flex-wrap: wrap; }
  .stats div b { display: block; font-size: 20px; }
  .err { color: var(--red); }
  :focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
  .provision-form input, .provision-form button { min-height: 44px; }
  .provision-box { border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin-top: 12px; }
  .provision-box[hidden] { display: none; }
  .provision-step { font-weight: 600; margin: 0 0 4px; }
  .provision-status { min-height: 1.5em; margin: 8px 0; }
  .provision-error { color: var(--red); font-weight: 600; }
  .blank-provision { max-width: 720px; }
  .blank-provision .lead { font-size: 14px; margin: 0 0 14px; }
  .blank-provision label { font-size: 13px; color: var(--text); margin-top: 12px; }
  .blank-provision .hint { margin: 4px 0 10px; }
  .blank-provision .advanced { margin: 12px 0; padding: 10px 0; border-block: 1px solid var(--line); }
  .blank-provision .advanced summary { cursor: pointer; padding: 4px 0; color: var(--muted); }
  .blank-provision .primary { width: 100%; min-height: 46px; margin-top: 8px; }
  .blank-provision [hidden] { display: none !important; }
  #toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--navy); color: #fff; padding: 9px 16px; border-radius: 6px; display: none; z-index: 9; }
  .login { max-width: 420px; margin: 12vh auto; text-align: center; }
  @media (max-width: 640px) { .grid2 { grid-template-columns: 1fr; } td.hide, th.hide { display: none; } }
</style>
<link rel="icon" type="image/svg+xml" href="/newassets/mayak-v1/mayak-favicon-32.svg">
<link rel="stylesheet" href="/newassets/mayak-v1/ui.css?v=20261110f"><script defer src="/newassets/mayak-v1/theme.js"></script>
</head>
<body class="admin-page">
<header><div class="brand"><img src="/newassets/mayak-v1/mayak-f7-small-on.svg" width="34" height="34" alt="" aria-hidden="true"><span class="wordmark">маяк</span></div><span class="muted" style="color:#8C9AAE">управление</span><button type="button" class="theme-toggle" data-theme-toggle aria-label="Тема: ночь. Переключить на день">День</button><span class="who" id="who"></span></header>
<nav id="tabs" hidden>
  <button data-t="people" class="on">Люди</button>
  <button data-t="servers">Серверы</button>
  <button data-t="settings">Настройки</button>
  <button data-t="audit">Журнал</button>
</nav>
<main id="app"></main>
<div id="toast"></div>
<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} } };
let token = store.get("mayak.token"), me = null, tab = "people", selected = null, activeProvisionFlow = null;
const kinds = { Windows: "Windows", Android: "Android", IPhone: "iPhone", Mac: "Mac", Linux: "Linux", Other: "Другое" };
const rank = r => ({ owner: 3, admin: 2, support: 1 }[r] || 0);

function toast(t) { const el = $("#toast"); el.textContent = t; el.style.display = "block"; clearTimeout(toast.t); toast.t = setTimeout(() => el.style.display = "none", 2600); }
function provisionReasonMessage(reason) {
  const messages = new Map([
    ["Поддерживаются только Ubuntu 22.04 и 24.04.", "На этом сервере неподдерживаемая ОС. Поддерживаются Ubuntu 22.04 и 24.04."],
    ["Поддерживается только архитектура x86_64.", "Сервер использует неподдерживаемую архитектуру. Нужна x86_64."],
    ["Обнаружен существующий контейнер, VPN или агент; установка остановлена.", "На сервере уже обнаружены контейнеры, VPN или агент. Чтобы не затронуть существующие службы, установка остановлена."],
    ["Один из необходимых портов уже занят.", "Необходимый VPN-порт уже занят. Освободите порт или выберите другой пустой сервер."],
    ["Read-only проверка не смогла надёжно подтвердить пустое состояние сервера.", "Не удалось безопасно подтвердить, что сервер пустой. Проверьте его вручную или выберите новый сервер."]
  ]);
  return typeof reason === "string" ? (messages.get(reason) || "Проверка не прошла. Установка недоступна; проверьте сервер и повторите проверку.") : "Проверка не прошла. Установка недоступна; проверьте сервер и повторите проверку.";
}
async function api(path, opt = {}) {
  const r = await fetch(path, { ...opt, headers: { "Content-Type": "application/json", ...(token ? { Authorization: "Bearer " + token } : {}), ...(opt.headers || {}) }, body: opt.body ? JSON.stringify(opt.body) : undefined });
  if (r.status === 401) { logout(); throw new Error("Нужно войти заново"); }
  if (r.status === 204) return null;
  const data = await r.json().catch(() => null);
  if (!r.ok) {
    const error = new Error(data?.error || ("Ошибка " + r.status));
    error.status = r.status;
    error.data = data;
    throw error;
  }
  return data;
}
const when = d => d ? new Date(d).toLocaleString("ru-RU", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }) : "—";
const day = d => d ? new Date(d).toLocaleDateString("ru-RU") : "без срока";
const bytes = n => n > 1e9 ? (n / 1e9).toFixed(1) + " ГБ" : n > 1e6 ? (n / 1e6).toFixed(0) + " МБ" : n > 0 ? (n / 1e3).toFixed(0) + " КБ" : "—";
const online = d => d && (Date.now() - new Date(d)) < 3 * 60e3;
function download(name, text) { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], { type: "text/plain" })); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); }
async function copy(text) { try { await navigator.clipboard.writeText(text); toast("Скопировано"); } catch { prompt("Скопируйте:", text); } }

// ───── Вход ─────
function clearProvisionSecrets() {
  const pass = $("#provPassword"), user = $("#provUser");
  if (pass) pass.value = "";
  if (user) user.value = "";
  if (activeProvisionFlow) {
    activeProvisionFlow.password = "";
    if (activeProvisionFlow.poll) clearTimeout(activeProvisionFlow.poll);
  }
  activeProvisionFlow = null;
}
window.addEventListener("pagehide", clearProvisionSecrets);
function logout() { clearProvisionSecrets(); if (token) fetch("/api/logout", { method: "POST", headers: { Authorization: "Bearer " + token } }).catch(() => {}); token = null; store.set("mayak.token", null); me = null; render(); }
async function startLogin() {
  const btn = $("#login"); btn.disabled = true;
  try {
    const r = await api("/api/auth/telegram", { method: "POST", body: { return: "/admin/" } });
    window.open(r.botUrl, "_blank");
    $("#loginHint").innerHTML = `Откройте бота и нажмите «Запустить». Если окно не открылось — <a href="${esc(r.botUrl)}" target="_blank">ссылка на бота</a>.`;
    const until = Date.now() + r.expiresInSeconds * 1000;
    while (Date.now() < until) {
      await new Promise(ok => setTimeout(ok, 2000));
      const res = await fetch(`/api/auth/telegram/${encodeURIComponent(r.requestId)}?client=web`);
      if (res.status === 202) continue;
      if (res.ok) { const d = await res.json(); token = d.token; store.set("mayak.token", token); return boot(); }
      break;
    }
    $("#loginHint").textContent = "Время на вход вышло. Нажмите кнопку ещё раз.";
  } catch (e) { $("#loginHint").textContent = e.message; }
  btn.disabled = false;
}

async function boot() {
  // Кнопка «Вернуться на сайт» из бота: завершаем вход по коду из адреса.
  const back = new URLSearchParams(location.search).get("login");
  if (back) {
    history.replaceState(null, "", location.pathname);
    try {
      const res = await fetch(`/api/auth/telegram/${encodeURIComponent(back)}?client=web`);
      if (res.ok) { const d = await res.json(); token = d.token; store.set("mayak.token", token); }
    } catch {}
  }
  if (!token) return render();
  try { me = (await api("/api/me")).account; } catch { return render(); }
  render();
}

function render() {
  if (tab !== "servers") clearProvisionSecrets();
  $("#who").innerHTML = me ? `${esc(me.name)} · <a href="#" id="out" style="color:#F5A524">выйти</a>` : "";
  if (me) $("#out").onclick = e => { e.preventDefault(); logout(); };
  $("#tabs").hidden = !(me && rank(me.role) >= 1);
  const app = $("#app");
  if (!me) {
    app.innerHTML = `<div class="card login"><h2>Вход в управление</h2><p class="muted">Через Telegram: бот подтвердит, что это вы.</p>
      <button class="b p" id="login">Войти через Telegram</button><p class="muted" id="loginHint"></p></div>`;
    $("#login").onclick = startLogin;
    return;
  }
  if (rank(me.role) < 1) {
    app.innerHTML = `<div class="card login"><h2>${esc(me.name)}</h2><p>${me.enabled ? "Доступ включён" : "Заявка ждёт одобрения"} · ${esc(day(me.paidUntil))}</p>
      <p class="muted">Управление доступно только администраторам.</p></div>`;
    return;
  }
  document.querySelectorAll("#tabs button").forEach(b => { b.classList.toggle("on", b.dataset.t === tab); b.onclick = () => { tab = b.dataset.t; selected = null; selectedServer = null; render(); }; });
  ({ people, servers, settings, audit })[tab]().catch(e => app.innerHTML = `<div class="card err">${esc(e.message)}</div>`);
}

// ───── Люди ─────
async function people() {
  const app = $("#app");
  const [ov, list] = await Promise.all([api("/api/admin/overview"), api("/api/admin/accounts" + (people.q ? "?q=" + encodeURIComponent(people.q) : ""))]);
  app.innerHTML = `<div class="card stats"><div><b>${ov.accounts}</b><span class="muted">людей</span></div><div><b>${ov.waiting}</b><span class="muted">ждут одобрения</span></div>
      <div><b>${ov.devices}</b><span class="muted">устройств</span></div><div><b>${ov.online}</b><span class="muted">в сети</span></div></div>
    <div class="card"><div class="row"><input class="grow" id="q" placeholder="Поиск по имени или @telegram" value="${esc(people.q || "")}"><button class="b p" id="add">+ Человек</button></div>
      <div class="list" id="list" style="margin-top:8px"></div></div><div id="detail"></div>`;
  $("#q").onchange = e => { people.q = e.target.value; render(); };
  $("#add").onclick = async () => { const name = prompt("Имя (например, «Мама»):"); if (!name) return; const a = await api("/api/admin/accounts", { method: "POST", body: { name } }); selected = a.id; render(); };
  const box = $("#list");
  if (!list.length) box.innerHTML = `<p class="muted">Пока никого. Людей добавит вход через бота, перенос с сервера или кнопка «+ Человек».</p>`;
  for (const row of list) {
    const a = row.account, on = row.devices.some(d => online(d.lastHandshake));
    const el = document.createElement("div");
    el.innerHTML = `<span class="dot ${on ? "on" : ""}"></span><div class="grow"><b>${esc(a.name)}</b> ${a.telegram ? `<span class="muted">@${esc(a.telegram)}</span>` : ""}
      <div class="muted">${row.devices.length} устр. · ${a.active ? esc(day(a.paidUntil)) : (a.enabled ? "подписка истекла" : "ждёт одобрения")}</div></div>
      ${!a.enabled ? `<span class="chip wait">ждёт</span>` : ""}${a.role !== "user" ? `<span class="chip">${esc(a.role)}</span>` : ""}`;
    el.onclick = () => { selected = a.id; showPerson(row); };
    box.appendChild(el);
    if (selected === a.id) showPerson(row);
  }
}

function showPerson(row) {
  const a = row.account, d = $("#detail");
  d.innerHTML = `<div class="card"><div class="row"><h2 class="grow">${esc(a.name)}</h2>
      ${!a.enabled ? `<button class="b p" id="approve">Одобрить</button>` : `<button class="b" id="pause">Приостановить</button>`}
      <button class="b d" id="del">Удалить</button></div>
    <div class="grid2">
      <div><label>Имя</label><input id="name" value="${esc(a.name)}" style="width:100%"></div>
      <div><label>Оплачено до (пусто — без срока)</label><input type="date" id="until" value="${a.paidUntil ? a.paidUntil.slice(0, 10) : ""}" style="width:100%"></div>
      <div><label>Устройств максимум</label><input type="number" id="max" min="0" value="${a.maxDevices}" style="width:100%"></div>
      <div><label>Скорость, Мбит/с: приём / отдача (0 — без лимита)</label><div class="row"><input type="number" id="down" min="0" value="${a.downMbps}" style="width:45%"><input type="number" id="up" min="0" value="${a.upMbps}" style="width:45%"></div></div>
      <div><label>Заметка</label><input id="note" value="${esc(row.note || "")}" style="width:100%"></div>
      ${me.role === "owner" ? `<div><label>Роль</label><select id="role" style="width:100%">${["user", "support", "admin", "owner"].map(r => `<option ${r === a.role ? "selected" : ""}>${r}</option>`).join("")}</select></div>` : ""}
    </div>
    <div class="row" style="margin-top:12px"><button class="b p" id="save">Сохранить</button><button class="b" id="invite" ${a.enabled && a.active ? "" : "disabled"}>Выдать приглашение</button>${row.legacy ? `<span class="muted">перенесён из Маяка для Windows</span>` : ""}</div>
    ${a.enabled && a.active ? `<p class="muted" style="margin-top:8px">Новый код заменит предыдущий неиспользованный. Передайте приглашение для регистрации в кабинете по email и паролю или для входа в приложении Маяк на Android/Windows.</p>` : `<p class="muted" role="status" style="margin-top:8px">Сначала включите аккаунт и убедитесь, что доступ действует. Приглашение само по себе доступ не включает.</p>`}
    <div id="inviteOut"></div></div>
    <div class="card"><div class="row"><h2 class="grow">Устройства</h2><select id="kind">${Object.entries(kinds).map(([k, v]) => `<option value="${k}">${v}</option>`).join("")}</select><button class="b" id="adddev">+ Устройство</button></div>
    <table><tr><th></th><th>Устройство</th><th class="hide">IP</th><th class="hide">Трафик</th><th>Был в сети</th><th></th></tr>
    ${row.devices.map(x => `<tr data-id="${x.id}"><td><span class="dot ${!x.enabled ? "off" : online(x.lastHandshake) ? "on" : ""}"></span></td>
      <td>${esc(x.name)}<div class="muted">${esc(kinds[x.kind] || x.kind)}</div></td><td class="hide">${esc(x.ip)}</td><td class="hide">${bytes(x.rxBytes + x.txBytes)}</td><td>${when(x.lastHandshake)}</td>
      <td class="row">${x.canExport ? `<button class="b" data-a="files">Файл</button>` : ""}<button class="b" data-a="toggle">${x.enabled ? "Выкл." : "Вкл."}</button><button class="b d" data-a="del">✕</button></td></tr>`).join("")}
    </table>${row.devices.length ? "" : `<p class="muted">Устройств нет. Из приложения «Маяк» человек добавит их сам, а своим людям можно выдать файл кнопкой «+ Устройство».</p>`}<div id="files"></div></div>`;
  const patch = body => api(`/api/admin/accounts/${a.id}`, { method: "PATCH", body }).then(() => { toast("Сохранено"); render(); }).catch(e => toast(e.message));
  if ($("#approve")) $("#approve").onclick = () => patch({ enabled: true });
  if ($("#pause")) $("#pause").onclick = () => confirm(`Приостановить доступ для «${a.name}»?`) && patch({ enabled: false });
  $("#del").onclick = () => confirm(`Удалить «${a.name}» со всеми устройствами?`) && api(`/api/admin/accounts/${a.id}`, { method: "DELETE" }).then(() => { selected = null; render(); }).catch(e => toast(e.message));
  $("#save").onclick = () => {
    const until = $("#until").value;
    const body = { name: $("#name").value, note: $("#note").value, maxDevices: +$("#max").value, downMbps: +$("#down").value, upMbps: +$("#up").value };
    if (until) body.paidUntil = until + "T23:59:59Z"; else body.clearPaidUntil = true;
    if ($("#role")) body.role = $("#role").value;
    patch(body);
  };
  if ($("#invite") && a.enabled && a.active) $("#invite").onclick = async () => {
    try {
      const r = await api(`/api/admin/accounts/${a.id}/invite`, { method: "POST" });
      const code = new URL(r.url, location.href).searchParams.get("invite");
      if (!code) throw new Error("Сервер не вернул код приглашения");
      const out = $("#inviteOut"); out.replaceChildren();
      const hint = document.createElement("p"); hint.className = "muted"; hint.style.marginTop = "10px";
      hint.textContent = `Передайте эту одноразовую ссылку для регистрации в кабинете по email и паролю или для входа в приложении на Android/Windows. Срок действия — ${r.expiresInDays} дней. Новый код заменит предыдущий неиспользованный.`;
      const invitation = `https://mayaklight.ru/my/?invite=${encodeURIComponent(code)}`;
      const link = document.createElement("a"); link.href = invitation; link.textContent = invitation; link.className = "muted"; link.style.overflowWrap = "anywhere";
      const value = document.createElement("pre"); value.textContent = code;
      const button = document.createElement("button"); button.type = "button"; button.className = "b"; button.textContent = "Копировать приглашение"; button.onclick = () => copy(invitation);
      out.append(hint, link, value, button);
    } catch (e) { toast(e.message); }
  };
  $("#adddev").onclick = async () => {
    const kind = $("#kind").value, name = prompt("Название устройства:", kinds[kind]); if (!name) return;
    try { const r = await api(`/api/admin/accounts/${a.id}/devices`, { method: "POST", body: { name, kind } }); showFiles(a, { name, kind }, r); toast("Устройство добавлено"); }
    catch (e) { toast(e.message); }
  };
  d.querySelectorAll("tr[data-id] button").forEach(b => b.onclick = async () => {
    const id = b.closest("tr").dataset.id, x = row.devices.find(v => v.id === id);
    try {
      if (b.dataset.a === "files") showFiles(a, x, await api(`/api/admin/devices/${id}/files`));
      if (b.dataset.a === "toggle") { await api(`/api/admin/devices/${id}`, { method: "PATCH", body: { enabled: !x.enabled } }); render(); }
      if (b.dataset.a === "del" && confirm(`Удалить «${x.name}»? Доступ на нём пропадёт.`)) { await api(`/api/admin/devices/${id}`, { method: "DELETE" }); render(); }
    } catch (e) { toast(e.message); }
  });
  d.scrollIntoView({ behavior: "smooth", block: "start" });
}

function showFiles(a, dev, f) {
  const base = `${a.name}-${dev.name}`.replace(/[^\p{L}\p{N}_-]+/gu, "_");
  const conf = dev.kind === "IPhone" || dev.kind === "Mac";
  $("#files").innerHTML = `<div style="margin-top:12px"><b>Доступ для «${esc(dev.name)}»</b>
    <p class="muted">${conf ? "iPhone и Mac: файл .conf → приложение AmneziaWG." : "Windows и Android: файл .vpn или ключ vpn:// → приложение AmneziaVPN."}</p>
    <div class="row"><button class="b p" id="dl1">Скачать ${conf ? ".conf" : ".vpn"}</button><button class="b" id="dl2">Скачать ${conf ? ".vpn" : ".conf"}</button><button class="b" id="cp">Копировать vpn://</button></div></div>`;
  const vpn = () => download(base + ".vpn", f.vpnKey), cf = () => download(base + ".conf", f.conf);
  $("#dl1").onclick = conf ? cf : vpn; $("#dl2").onclick = conf ? vpn : cf; $("#cp").onclick = () => copy(f.vpnKey);
}

// ───── Серверы ─────
// Доступность с машины API (Москва). Старый API без /probes — просто без значков.
const probeNames = { icmp: "Пинг", tcp: "Порт Xray", tls: "TLS", awg: "Туннель AWG", xray: "Туннель Xray" };
const probeErrors = { timeout: "нет ответа", refused: "порт закрыт", reset: "сброс соединения", unreachable: "недоступен", dns: "ошибка DNS", tls: "ошибка TLS", loss: "есть потери", unavailable: "проверка недоступна", error: "ошибка" };
let probeData = null, selectedServer = null;
function probeState(k) { return k.lastError === "unavailable" ? "na" : k.lastOk ? (k.lastError === "loss" ? "warn" : "ok") : "bad"; }
function probeChips(id) {
  const kinds = probeData?.servers?.[id];
  if (!kinds?.length) return "";
  const at = kinds.reduce((m, k) => k.lastAt > m ? k.lastAt : m, "");
  return `<div class="probes" aria-label="Доступность с Москвы"><span class="muted probe-at">с Москвы ${esc(when(at))}</span>${kinds.map(k => {
    const st = probeState(k);
    const tail = st === "ok" || st === "warn" ? (k.lastMs != null ? `${k.lastMs} мс` : "есть") : (probeErrors[k.lastError] || "нет");
    return `<span class="probe ${st}" title="${esc(probeNames[k.kind] || k.kind)}: ${esc(tail)} · за ${probeData.hours} ч успешно ${k.uptimePercent ?? "—"}%"><i aria-hidden="true"></i>${esc(probeNames[k.kind] || k.kind)} · ${esc(tail)}</span>`;
  }).join("")}</div>`;
}
// Проверка по кнопке: несколько секунд, затем перерисовка списка (и открытой карточки).
async function runProbes(serverId, button) {
  const label = button.textContent;
  button.disabled = true; button.textContent = "Проверяю…"; button.setAttribute("aria-busy", "true");
  try {
    await api("/api/admin/probes/run" + (serverId ? "?serverId=" + encodeURIComponent(serverId) : ""), { method: "POST" });
    toast("Проверка завершена");
    if (serverId) selectedServer = serverId;
    render();
  } catch (e) { toast(e.message); button.disabled = false; button.textContent = label; button.removeAttribute("aria-busy"); }
}

function probeHistory(id) {
  const kinds = probeData?.servers?.[id];
  const head = title => `<div class="row probe-title"><h3 class="grow">${title}</h3><button class="b" id="probeOne" type="button">Проверить сервер</button></div>`;
  if (!probeData) return "";
  if (!kinds?.length) return head("Доступность с Москвы") + `<p class="muted">Этот сервер ещё не проверялся. Нажмите «Проверить сервер» — проверка займёт несколько секунд.</p>`;
  const filled = kinds.reduce((m, k) => Math.max(m, k.buckets.filter(b => b.okRatio != null).length), 0);
  if (!probeData.background && filled < 4) {
    const at = kinds.reduce((m, k) => k.lastAt > m ? k.lastAt : m, "");
    return head(`Доступность с Москвы · ${esc(when(at))}`) + `<div class="probe-history">${kinds.map(k => {
      const st = probeState(k);
      const value = st === "ok" || st === "warn" ? (k.lastMs != null ? `${k.lastMs} мс` : "есть") : (probeErrors[k.lastError] || "нет");
      return `<div class="probe-head"><span class="probe ${st}"><i aria-hidden="true"></i>${esc(probeNames[k.kind] || k.kind)}</span><span>${esc(value)}${k.lastError === "loss" ? " · есть потери" : ""}</span></div>`;
    }).join("")}<p class="muted">Проверка из дата-центра в Москве: показывает, что сервер жив и путь из России открыт. Блокировки у мобильных и домашних провайдеров могут отличаться.</p></div>`;
  }
  return head(`Доступность с Москвы за ${probeData.hours} ч`) + `<div class="probe-history">${kinds.map(k => `
    <div class="probe-line"><div class="probe-head"><b>${esc(probeNames[k.kind] || k.kind)}</b><span class="muted">${k.lastError === "unavailable" ? "проверка недоступна на сервере API" : `успешно ${k.uptimePercent ?? "—"}% · в среднем ${k.avgMs != null ? k.avgMs + " мс" : "—"}`}</span></div>
    <div class="probe-bar" role="img" aria-label="${esc(probeNames[k.kind] || k.kind)}: история за ${probeData.hours} ч, успешно ${k.uptimePercent ?? "—"}%">${k.buckets.map(b => `<span class="${b.okRatio == null ? "none" : b.okRatio >= .99 ? "ok" : b.okRatio > 0 ? "warn" : "bad"}"></span>`).join("")}</div></div>`).join("")}
    <p class="muted">Проверка из дата-центра в Москве: показывает, что сервер жив и путь из России открыт. Блокировки у мобильных и домашних провайдеров могут отличаться.</p></div>`;
}

async function servers() {
  const app = $("#app");
  const [list, probes] = await Promise.all([api("/api/admin/servers"), api("/api/admin/probes?hours=24").catch(() => null)]);
  probeData = probes;
  const exits = list.filter(s => s.role === "exit");
  app.innerHTML = `<div class="card"><div class="row"><h2 class="grow">Серверы</h2><button class="b" id="probeAll" type="button">Проверить серверы</button>${rank(me.role) >= 2 ? `<button class="b p" id="addBlank">Добавить сервер</button>` : ""}</div>
    <div class="list" id="list"></div></div><div id="detail"></div>`;
  if ($("#addBlank")) $("#addBlank").onclick = () => blankServerForm();
  $("#probeAll").onclick = () => runProbes(null, $("#probeAll"));
  const box = $("#list");
  if (!list.length) box.innerHTML = `<p class="muted">Серверов нет. Нажмите «Добавить сервер»: Маяк сам установит VPN по адресу и паролю SSH.</p>`;
  for (const s of list) {
    const el = document.createElement("div");
    const target = s.targetExitId ? exits.find(e => e.id === s.targetExitId)?.name : null;
    el.innerHTML = `<span class="dot ${s.lastError ? "warn" : s.online ? "on" : "off"}"></span><div class="grow"><b>${esc(s.name)}</b> <span class="muted">${esc(s.host)}</span>
      <div class="muted">${s.role === "exit" ? "выход" + (s.active ? " · активный" : "") : "вход" + (target ? " → " + esc(target) : " · не пересылает")}${s.report?.dryRun ? " · <b>пробный режим</b>" : ""} · ${s.lastSeen ? "связь " + when(s.lastSeen) : "агент не выходил на связь"}${s.provisioningStatus ? " · установка: " + esc(s.provisioningStatus) : ""}</div>
      ${s.provisioningMessage ? `<div class="muted">${esc(s.provisioningMessage)}</div>` : ""}
      ${s.lastError ? `<div class="err" style="font-size:12.5px">${esc(s.lastError)}</div>` : ""}${probeChips(s.id)}</div>`;
    el.onclick = async () => {
      clearProvisionSecrets();
      selectedServer = s.id;
      if (s.provisioningStatus) {
        try { serverDetail({ ...s, ...(await api(`/api/admin/provision/jobs/${s.id}`)) }, exits); }
        catch (e) { toast(e.message); serverDetail(s, exits); }
      } else serverDetail(s, exits);
    };
    box.appendChild(el);
    if (selectedServer === s.id) el.onclick();
  }
}

function blankServerForm() {
  clearProvisionSecrets();
  const flow = activeProvisionFlow = {
    password: "", poll: 0, jobId: null, fingerprint: "", trusted: false,
    inspection: null, generation: 0, addressGeneration: 0,
    inspectPending: false, startPending: false, startAttempted: false, fingerprintPending: false
  };
  const detail = $("#detail");
  detail.innerHTML = `<div class="card blank-provision">
    <p class="muted" style="margin:0 0 6px">НОВЫЙ СЕРВЕР</p>
    <h2>Добавить сервер</h2>
    <p class="muted lead">Введите адрес и SSH пароль. Маяк проверит систему и сам подготовит VPN. Если на сервере уже что-то установлено, оно будет перезаписано: прежние настройки сохранятся в архив на самом сервере.</p>
    <form id="provisionForm" class="provision-form" autocomplete="off" onsubmit="return false">
      <label for="provHost">IP-адрес сервера</label>
      <input id="provHost" required inputmode="decimal" placeholder="Публичный IPv4 из панели хостинга" style="width:100%" aria-describedby="provHostHint">
      <p id="provHostHint" class="muted hint">Например, адрес из панели вашего хостинга.</p>
      <label for="provPassword">Пароль SSH</label>
      <input id="provPassword" type="password" maxlength="512" autocomplete="new-password" placeholder="Введите пароль root" required style="width:100%">
      <details class="advanced"><summary>Дополнительные параметры</summary>
        <div class="grid2">
          <div><label for="provUser">Пользователь SSH</label><input id="provUser" value="root" maxlength="32" autocomplete="off" required style="width:100%"></div>
          <div><label for="provPort">Порт SSH</label><input id="provPort" type="number" min="1" max="65535" value="22" required style="width:100%"></div>
          <div><label for="provName">Название</label><input id="provName" maxlength="100" style="width:100%"></div>
          <div><label for="provCity">Город (необязательно)</label><input id="provCity" maxlength="80" style="width:100%"></div>
          <div><label for="provCountry">Страна (необязательно)</label><input id="provCountry" maxlength="80" style="width:100%"></div>
        </div>
      </details>
      <p id="provError" class="provision-status provision-error" role="alert" tabindex="-1"></p>
      <button class="b p primary" id="provFingerprint" type="button">Проверить сервер</button>
      <section id="provTrustBox" class="provision-box" hidden aria-labelledby="provTrustTitle">
        <h3 class="provision-step" id="provTrustTitle">Разрешить первое подключение</h3>
        <p class="muted">При первом подключении сайт запомнит SSH-ключ этого адреса. Если ключ изменится, проверка остановится. Если адрес сервера верный и это ваш сервер, продолжайте.</p>
        <details><summary>Показать SSH-ключ</summary><pre id="provFingerprintValue"></pre></details>
        <button class="b p primary" id="provInspect" type="button" disabled>Доверять ключу и проверить доступ</button>
        <p id="provInspectStatus" class="provision-status" role="status" aria-live="polite"></p>
      </section>
      <section id="provInspectBox" class="provision-box" hidden aria-labelledby="provInspectTitle">
        <h3 class="provision-step" id="provInspectTitle">Результат проверки</h3>
        <p id="provInspectResult" class="provision-status" role="status" aria-live="polite"></p>
        <div id="provInstallConfirm" hidden>
          <p id="provOverwriteWarn" class="provision-warn" role="alert" hidden></p>
          <label><input id="provBlankConfirm" type="checkbox"> <span id="provConfirmText">Разрешаю установить на этом сервере компоненты VPN.</span></label>
          <button class="b p primary" id="provStart" type="button" disabled>Установить VPN</button>
          <p id="provStartStatus" class="provision-status" role="status" aria-live="polite"></p>
        </div>
      </section>
      <section id="provJobBox" class="provision-box" hidden aria-labelledby="provJobTitle">
        <h3 class="provision-step" id="provJobTitle">Установка</h3>
        <p id="provJobStatus" class="provision-status" role="status" aria-live="polite"></p>
        <button class="b" id="provBack" type="button">Вернуться к серверам</button>
      </section>
    </form></div>`;

  const live = generation => activeProvisionFlow === flow && flow.generation === generation;
  const error = text => { const el = $("#provError"); if (el && activeProvisionFlow === flow) { el.textContent = text; el.focus(); } };
  const credentialsSnapshot = () => ({
    host: $("#provHost").value.trim(), port: Number($("#provPort").value),
    user: $("#provUser").value.trim(), password: $("#provPassword").value,
    trustedFingerprint: flow.fingerprint, trustFingerprint: flow.trusted
  });
  const invalidateInspection = () => {
    if (activeProvisionFlow !== flow) return;
    flow.generation++;
    flow.inspection = null;
    $("#provInspectBox").hidden = true;
    $("#provInstallConfirm").hidden = true;
    if ($("#provBlankConfirm")) $("#provBlankConfirm").checked = false;
    if ($("#provStart")) $("#provStart").disabled = true;
    $("#provInspectStatus").textContent = "";
  };
  const invalidateAddress = () => {
    if (activeProvisionFlow !== flow) return;
    flow.generation++;
    flow.addressGeneration++;
    flow.fingerprint = "";
    flow.trusted = false;
    flow.inspection = null;
    flow.password = "";
    $("#provPassword").value = "";
    $("#provFingerprint").hidden = false;
    $("#provFingerprint").disabled = false;
    $("#provFingerprint").textContent = "Проверить сервер";
    $("#provTrustBox").hidden = true;
    $("#provInspectBox").hidden = true;
    $("#provError").textContent = "";
    $("#provInspectStatus").textContent = "";
  };
  const setBusy = busy => {
    for (const id of ["provHost", "provPort", "provUser", "provPassword", "provName", "provCity", "provCountry"])
      if ($("#" + id)) $("#" + id).disabled = busy;
  };
  const sendCredentials = (path, extra, generation) => {
    if (!live(generation)) throw new Error("Форма изменилась. Повторите проверку.");
    const body = { ...credentialsSnapshot(), ...extra };
    const pending = api(path, { method: "POST", body });
    body.password = "";
    return pending;
  };

  $("#provHost").addEventListener("input", invalidateAddress);
  $("#provPort").addEventListener("input", invalidateAddress);
  $("#provUser").addEventListener("input", invalidateInspection);
  $("#provPassword").addEventListener("input", invalidateInspection);
  for (const id of ["provName", "provCity", "provCountry"])
    $("#" + id).addEventListener("input", invalidateInspection);

  $("#provFingerprint").onclick = async () => {
    if (activeProvisionFlow !== flow || flow.fingerprintPending || flow.fingerprint || !$("#provisionForm").reportValidity()) return;
    flow.fingerprintPending = true;
    const generation = flow.generation, addressGeneration = flow.addressGeneration;
    const host = $("#provHost").value.trim(), port = Number($("#provPort").value);
    const button = $("#provFingerprint");
    button.disabled = true; button.textContent = "Проверяю адрес…";
    $("#provError").textContent = "";
    try {
      const result = await api("/api/admin/provision/host-key", { method: "POST", body: { host, port } });
      if (!live(generation) || addressGeneration !== flow.addressGeneration || host !== $("#provHost").value.trim() || port !== Number($("#provPort").value)) return;
      if (result.host !== host || Number(result.port) !== port || !/^SHA256:[A-Za-z0-9+/]{43}$/.test(result.fingerprint || ""))
        throw new Error("Сервер вернул неожиданные данные SSH-ключа. Проверьте адрес и попробуйте ещё раз.");
      flow.fingerprint = result.fingerprint;
      flow.trusted = false;
      $("#provFingerprintValue").textContent = `${result.fingerprint}\n${host}:${port}`;
      $("#provTrustBox").hidden = false;
      $("#provFingerprint").hidden = true;
      $("#provInspect").disabled = !$("#provPassword").value;
      $("#provInspectStatus").textContent = "SSH-ключ получен без отправки пароля.";
    } catch (e) {
      if (live(generation) && addressGeneration === flow.addressGeneration) {
        flow.password = ""; flow.trusted = false; flow.fingerprint = ""; flow.inspection = null;
        $("#provPassword").value = ""; $("#provTrustBox").hidden = true;
        $("#provFingerprint").hidden = false; $("#provFingerprint").disabled = false;
        error("Не удалось получить SSH-ключ без пароля. Проверьте IP-адрес и доступность SSH.");
      }
    } finally {
      flow.fingerprintPending = false;
      if (activeProvisionFlow === flow && button.isConnected && !button.hidden) {
        button.disabled = false; button.textContent = "Проверить сервер";
      }
    }
  };
  $("#provPassword").addEventListener("input", () => {
    if (flow.fingerprint) $("#provInspect").disabled = !$("#provPassword").value || flow.inspectPending;
  });

  $("#provInspect").onclick = async () => {
    if (activeProvisionFlow !== flow || flow.inspectPending || flow.startPending || flow.startAttempted || flow.fingerprintPending || !flow.fingerprint || !$("#provPassword").value || !$("#provisionForm").reportValidity()) return;
    flow.inspectPending = true;
    flow.trusted = true; // This click explicitly accepts first-use pinning for this address.
    flow.inspection = null;
    $("#provInspectBox").hidden = true;
    $("#provInstallConfirm").hidden = true;
    $("#provBlankConfirm").checked = false;
    $("#provStart").disabled = true;
    const generation = ++flow.generation;
    $("#provError").textContent = "";
    $("#provInspectStatus").textContent = "Проверяю пароль, систему и свободные порты. Установка пока не запускается.";
    $("#provInspect").disabled = true;
    setBusy(true);
    try {
      const result = await sendCredentials("/api/admin/provision/inspect", {}, generation);
      if (!live(generation)) return;
      const x = result?.inspection;
      if (!x || x.supported !== true || !Number.isInteger(x.awgPort) || x.awgPort < 1 || x.awgPort > 65535 ||
          !Number.isInteger(x.xrayPort) || x.xrayPort < 1 || x.xrayPort > 65535 || x.awgPort === x.xrayPort) {
        flow.inspection = x || null;
        $("#provInspectBox").hidden = false;
        $("#provInstallConfirm").hidden = true;
        $("#provInspectResult").textContent = provisionReasonMessage(x?.reason);
        $("#provInspectStatus").textContent = "Установка недоступна, пока проверка не пройдёт.";
        $("#provPassword").value = "";
        flow.password = "";
        return;
      }
      flow.inspection = { ...x, host: $("#provHost").value.trim(), port: Number($("#provPort").value), user: $("#provUser").value.trim() };
      const occupied = x.occupied === true;
      $("#provInspectResult").textContent = occupied
        ? `${x.operatingSystem || "Система"} ${x.osVersion || ""} · ${x.architecture || ""}. Сервер не пустой. Установка ещё не запущена.`
        : `${x.operatingSystem || "Система"} ${x.osVersion || ""} · ${x.architecture || ""}. Проверка прошла; UDP ${x.awgPort} и TCP ${x.xrayPort} свободны. Установка ещё не запущена.`;
      $("#provOverwriteWarn").hidden = !occupied;
      $("#provOverwriteWarn").textContent = occupied
        ? "На сервере найдены контейнеры, VPN или агент. При установке они будут удалены: все контейнеры Docker, службы и интерфейсы WireGuard/AmneziaWG/OpenVPN/Xray и прежний агент Маяка. Перед удалением настройки сохраняются в архив /root/mayak-overwrite-….tar.gz на этом сервере."
        : "";
      $("#provConfirmText").textContent = occupied ? "Перезаписать сервер и установить VPN." : "Разрешаю установить на этом сервере компоненты VPN.";
      $("#provStart").textContent = occupied ? "Перезаписать и установить" : "Установить VPN";
      $("#provInspectBox").hidden = false;
      $("#provInstallConfirm").hidden = false;
      $("#provBlankConfirm").checked = true;
      $("#provStart").disabled = false;
      $("#provInspectStatus").textContent = occupied ? "Проверьте предупреждение и нажмите «Перезаписать и установить»." : "Можно начинать установку.";
    } catch (e) {
      if (live(generation)) {
        flow.inspection = null;
        $("#provPassword").value = "";
        flow.password = "";
        const reason = e?.data?.inspection?.reason;
        const knownProvisionReason = typeof reason === "string";
        const safeReason = provisionReasonMessage(reason);
        $("#provInspectBox").hidden = false;
        $("#provInstallConfirm").hidden = true;
        $("#provInspectResult").textContent = safeReason;
        $("#provInspectStatus").textContent = knownProvisionReason
          ? "Проверка остановлена. Пароль очищен; закреплённый SSH-ключ сохранён для этого адреса."
          : "Не удалось завершить проверку SSH-доступа. Пароль очищен; проверьте данные подключения и попробуйте снова.";
        error(knownProvisionReason ? safeReason : "Не удалось проверить SSH-доступ. Проверьте адрес, имя пользователя и SSH-доступ. Закреплённый ключ сохранён; после исправления введите пароль и повторите проверку.");
      }
    } finally {
      flow.inspectPending = false;
      if (activeProvisionFlow === flow && live(generation)) {
        setBusy(false);
        $("#provInspect").disabled = !flow.fingerprint || !$("#provPassword").value;
      }
    }
  };

  $("#provBlankConfirm").onchange = e => {
    $("#provStart").disabled = !e.target.checked || !flow.inspection?.supported || flow.startPending || flow.startAttempted;
  };
  $("#provStart").onclick = async () => {
    if (activeProvisionFlow !== flow || flow.inspectPending || flow.fingerprintPending || flow.startPending || flow.startAttempted || !flow.trusted ||
        !flow.inspection?.supported || !$("#provPassword").value || !$("#provBlankConfirm").checked) return;
    const inspection = flow.inspection;
    if (inspection.host !== $("#provHost").value.trim() || inspection.port !== Number($("#provPort").value) ||
        inspection.user !== $("#provUser").value.trim()) {
      error("Данные подключения изменились. Повторите проверку сервера.");
      return;
    }
    const awgPort = inspection.awgPort, xrayPort = inspection.xrayPort;
    if (!Number.isInteger(awgPort) || !Number.isInteger(xrayPort) || awgPort === xrayPort) {
      error("Настройки портов изменились. Повторите проверку сервера.");
      return;
    }
    flow.startPending = true;
    flow.startAttempted = true;
    const generation = ++flow.generation;
    const button = $("#provStart");
    button.disabled = true; button.textContent = "Отправляю запрос…";
    $("#provStartStatus").textContent = "Создаю одну задачу установки…";
    setBusy(true);
    const host = $("#provHost").value.trim();
    const extra = {
      name: $("#provName").value.trim() || host,
      city: $("#provCity").value.trim(), country: $("#provCountry").value.trim(),
      awgPort, xrayPort, confirmBlankServer: true, overwrite: inspection.occupied === true
    };
    try {
      const result = await sendCredentials("/api/admin/provision/start", extra, generation);
      if (!live(generation)) return;
      if (!result?.jobId) throw new Error("Сервер не подтвердил создание задачи. Проверьте список серверов перед новой попыткой.");
      flow.jobId = result.jobId;
      flow.fingerprint = ""; flow.trusted = false; flow.inspection = null; flow.password = "";
      $("#provPassword").value = "";
      $("#provFingerprint").hidden = true;
      $("#provTrustBox").hidden = true;
      $("#provInspectBox").hidden = true;
      $("#provJobBox").hidden = false;
      $("#provJobStatus").textContent = "Задача принята. Сервер останется неактивным до подтверждения связи агента.";
      $("#provBack").onclick = () => { clearProvisionSecrets(); tab = "servers"; selected = null; render(); };
      pollProvisionJob(flow);
    } catch (e) {
      if (live(generation)) {
        flow.fingerprint = ""; flow.trusted = false; flow.inspection = null; flow.password = "";
        $("#provPassword").value = "";
        $("#provFingerprint").hidden = true;
        $("#provTrustBox").hidden = true;
        $("#provInspectBox").hidden = true;
        $("#provStartStatus").textContent = "Ответ не подтверждён. Автоповтор отключён, чтобы не создать дубликат. Вернитесь к списку и проверьте статус сервера перед любым повтором.";
        $("#provJobBox").hidden = false;
        $("#provJobStatus").textContent = "Ответ установки не подтверждён. Проверьте список серверов перед повторной попыткой.";
        $("#provBack").onclick = () => { clearProvisionSecrets(); tab = "servers"; selected = null; render(); };
        error("Задача установки не подтверждена. Вернитесь к списку серверов и проверьте её статус перед новой попыткой.");
      }
    } finally {
      flow.startPending = false;
      if (activeProvisionFlow === flow && live(generation)) setBusy(false);
    }
  };
}

async function pollProvisionJob(flow) {
  if (!activeProvisionFlow || activeProvisionFlow !== flow || !flow.jobId) return;
  const messages = { queued: "Задача ожидает начала установки.", preflight: "Повторная read-only проверка перед установкой.", installing: "Подготовка нового сервера.", installing_awg: "Устанавливается AmneziaWG.", installing_xray: "Устанавливается Xray с кластерной identity.", installing_agent: "Настраивается агент.", awaiting_agent: "Ожидается связь агента и подтверждение синхронизации.", syncing: "Агент синхронизирует настройки.", installed: "Агент подтвердил identity и синхронизацию. Сервер сохранён неактивным.", failed: "Установка остановлена. Сервер оставлен неактивным; автоматическая очистка не выполнялась.", interrupted: "API перезапущен; учётные данные очищены. Перед новой попыткой проверьте сервер вручную." };
  try {
    const r = await api(`/api/admin/provision/jobs/${flow.jobId}`);
    if (activeProvisionFlow !== flow) return;
    // Remote provisioning messages may contain credentials or command output.
    // Restrict this credential-bearing flow to known status labels.
    $("#provJobStatus").textContent = messages[r.provisioningStatus] || "Статус задачи обновлён.";
    if (["installed", "failed", "interrupted"].includes(r.provisioningStatus)) {
      clearProvisionSecrets();
      $("#provBack").hidden = false;
      return;
    }
  } catch (e) {
    if (activeProvisionFlow !== flow) return;
    $("#provJobStatus").textContent = "Не удалось обновить статус задачи. Последнее показанное состояние может устареть.";
  }
  flow.poll = setTimeout(() => pollProvisionJob(flow), 2000);
}

function installBox(cmd, dry) {
  $("#out").innerHTML = `<p>Выполните на этом сервере под root (ssh или консоль хостинга).</p>
    ${dry ? `<p><b>Сначала пробный запуск.</b> Агент перенесёт людей с сервера сюда и покажет, что изменил бы, но VPN не тронет:</p><pre>${esc(dry)}</pre>
    <button class="b" id="cpd">Копировать</button>
    <p style="margin-top:14px">Если в отчёте сервера «отозвал бы 0» — включите по-настоящему (та же команда без <code>--dry-run</code>):</p>` : ""}
    <pre>${esc(cmd)}</pre><button class="b" id="cp">Копировать</button>
    <p class="muted">Команды показываются один раз — в них секретный токен агента.</p>`;
  $("#cp").onclick = () => copy(cmd);
  if ($("#cpd")) $("#cpd").onclick = () => copy(dry);
}

function reportBox(s) {
  const r = s.report;
  if (!r && !s.lastError) return "";
  const lines = [];
  if (r?.dryRun) lines.push(`<b>Пробный режим</b> — агент ничего не меняет на сервере.`);
  if (r?.result) lines.push(`Последнее применение: добавлено ${r.result.added}, отозвано ${r.result.removed}, всего подключений ${r.result.total}.`);
  for (const w of r?.warnings || []) lines.push(esc(w));
  if (s.lastError) lines.push(`<span class="err">${esc(s.lastError)}</span>`);
  return `<h3 style="margin:16px 0 6px;font-size:14px">Отчёт агента${r?.at ? ` <span class="muted">· ${when(r.at)}</span>` : ""}</h3><ul style="margin:0;padding-left:18px;font-size:13.5px;line-height:1.5">${lines.map(l => `<li>${l}</li>`).join("")}</ul>`;
}

function serverDetail(s, exits) {
  const canActivate = !s.provisioningStatus || s.provisioningReady === true;
  $("#detail").innerHTML = `<div class="card"><div class="row"><h2 class="grow">${esc(s.name)}</h2>
      ${s.role === "exit" && !s.active && canActivate ? `<button class="b p" id="act">Сделать активным</button>` : ""}
      ${rank(me.role) >= 2 ? `<button class="b" id="tok">Новая команда установки</button><button class="b d" id="del">Удалить</button>` : ""}</div>
    <div class="grid2">
      <div><label>Название</label><input id="name" value="${esc(s.name)}" style="width:100%"></div>
      <div><label>Адрес</label><input id="host" value="${esc(s.host)}" style="width:100%"></div>
      <div><label>Город · страна</label><div class="row"><input id="city" value="${esc(s.city)}" style="width:48%"><input id="country" value="${esc(s.country)}" style="width:48%"></div></div>
      <div><label>Чем знаменит (для карточки в приложении)</label><input id="fact" value="${esc(s.fact)}" style="width:100%"></div>
      ${s.role === "exit" && rank(me.role) >= 2 ? `<div><label>Автовыбор в приложении</label><select id="autosel" style="width:100%"><option value="0">выключен</option><option value="1" ${s.autoSelectEnabled ? "selected" : ""}>включён</option></select></div>
      <div><label>Адрес выхода в интернет (IPv4, через запятую)</label><input id="egress" value="${esc((s.expectedEgressIps || []).join(", "))}" placeholder="${esc(s.host)}" style="width:100%"></div>` : ""}
      ${s.role === "entry" ? `<div><label>Пересылать на выход</label><select id="target" style="width:100%"><option value="">— не пересылать —</option>${exits.map(e => `<option value="${e.id}" ${e.id === s.targetExitId ? "selected" : ""}>${esc(e.name)} (${esc(e.host)})</option>`).join("")}</select></div>` : ""}
    </div><div class="row" style="margin-top:12px"><button class="b p" id="save">Сохранить</button><span class="muted">агент ${esc(s.agentVersion || "—")}</span></div>
    ${s.provisioningStatus ? `<p class="muted" role="status">Установка: ${esc(s.provisioningStatus)}. ${esc(s.provisioningMessage || "")}${!canActivate ? " Сервер останется неактивным до подтверждения identity и синхронизации." : ""}</p>` : ""}
    ${probeHistory(s.id)}${reportBox(s)}<div id="out"></div></div>`;
  const patch = body => api(`/api/admin/servers/${s.id}`, { method: "PATCH", body }).then(() => { toast("Сохранено"); render(); }).catch(e => toast(e.message));
  $("#save").onclick = () => {
    const body = { name: $("#name").value, host: $("#host").value, city: $("#city").value, country: $("#country").value, fact: $("#fact").value };
    if ($("#target")) { if ($("#target").value) body.targetExitId = $("#target").value; else body.clearTarget = true; }
    if ($("#autosel")) {
      // Send only what changed: the API refuses to enable auto-select for a not-ready exit.
      const egress = $("#egress").value.split(/[\s,;]+/).filter(Boolean);
      if (egress.join(",") !== (s.expectedEgressIps || []).join(",")) body.expectedEgressIps = egress;
      const auto = $("#autosel").value === "1";
      if (auto !== !!s.autoSelectEnabled) body.autoSelectEnabled = auto;
    }
    patch(body);
  };
  if ($("#act")) $("#act").onclick = () => confirm("Перевести трафик на этот выход? Входы переключатся на него.") && patch({ active: true });
  if ($("#probeOne")) $("#probeOne").onclick = () => runProbes(s.id, $("#probeOne"));
  if ($("#tok")) $("#tok").onclick = async () => { if (!confirm("Старый токен агента перестанет работать. Продолжить?")) return; const r = await api(`/api/admin/servers/${s.id}/token`, { method: "POST" }); installBox(r.install, r.installDryRun); };
  if ($("#del")) $("#del").onclick = () => confirm(`Удалить «${s.name}» из списка? На самом сервере VPN продолжит работать.`) && api(`/api/admin/servers/${s.id}`, { method: "DELETE" }).then(render);
}

// ───── Настройки ─────
async function settings() {
  const c = await api("/api/admin/cluster"), app = $("#app");
  if (!c.ready) { app.innerHTML = `<div class="card"><h2>Настройки</h2><p class="muted">Появятся, когда агент первого выхода выйдет на связь: его ключи станут общими для всех выходов.</p></div>`; return; }
  app.innerHTML = `<div class="card"><h2>Общие настройки</h2><div class="grid2">
    <div><label>Название в приложениях</label><input id="title" value="${esc(c.title)}" style="width:100%"></div>
    <div><label>Адрес для пользователей (пусто — вход или активный выход)</label><input id="host" value="${esc(c.publicHost)}" placeholder="${esc(c.effectiveHost)}" style="width:100%"></div>
    <div><label>DNS</label><div class="row"><input id="dns1" value="${esc(c.dns1)}" style="width:48%"><input id="dns2" value="${esc(c.dns2)}" style="width:48%"></div></div>
    </div><div class="row" style="margin-top:12px"><button class="b p" id="save">Сохранить</button></div>
    <p class="muted">Сейчас пользователи подключаются к <b>${esc(c.effectiveHost || "—")}</b>. AmneziaWG ${esc(c.awg.protocol)}, UDP ${c.awg.port}, подсеть ${esc(c.awg.subnet)}${c.xray ? ` · Xray TCP ${c.xray.port}, маскировка под ${esc(c.xray.sni)}` : ""}. Ревизия ${c.revision}.</p></div>
    ${c.xray && c.xray.fingerprints ? `<div class="card"><h2>Xray для клиентов</h2>
    <div><label>Отпечаток TLS в ссылках, подписках и конфигах</label>
    <select id="xfp"><option value="">по умолчанию (${esc(c.xray.defaultFingerprint)})</option>${c.xray.fingerprints.map(f => `<option value="${esc(f)}"${f === c.xray.clientFingerprint ? " selected" : ""}>${esc(f)}</option>`).join("")}</select></div>
    <div class="row" style="margin-top:12px"><button class="b p" id="xsave">Сохранить отпечаток</button></div>
    <p class="muted">Сейчас выдаётся <b>${esc(c.xray.effectiveFingerprint)}</b>. Меняет только настройки у клиентов: серверы и их подтверждение не затрагиваются. Подписки обновятся при следующем обновлении в приложении.</p></div>` : ""}`;
  $("#save").onclick = () => api("/api/admin/cluster", { method: "PATCH", body: { title: $("#title").value, publicHost: $("#host").value, dns1: $("#dns1").value, dns2: $("#dns2").value } }).then(() => { toast("Сохранено"); render(); }).catch(e => toast(e.message));
  if ($("#xsave")) $("#xsave").onclick = () => api("/api/admin/cluster", { method: "PATCH", body: { xrayClientFingerprint: $("#xfp").value } }).then(() => { toast("Сохранено"); render(); }).catch(e => toast(e.message));
}

async function audit() {
  const list = await api("/api/admin/audit");
  $("#app").innerHTML = `<div class="card"><h2>Журнал</h2><table><tr><th>Когда</th><th>Действие</th><th>Подробности</th></tr>
    ${list.map(x => `<tr><td>${when(x.at)}</td><td>${esc(x.action)}</td><td>${esc(x.details)}</td></tr>`).join("")}</table></div>`;
}

boot();
